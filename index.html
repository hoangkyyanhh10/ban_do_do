
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Quản lý tuyến trạm BTS</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root {
  --header-height: 54px;
  --blue: #17365d;
  --accent: #1674d1;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
}

/* HEADER */

header {
  height: var(--header-height);
  min-height: var(--header-height);
  background: var(--blue);
  color: white;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 18px;
  font-weight: bold;
  z-index: 1000;
}

#mobileToggle {
  display: none;
  border: 1px solid #ffffff80;
  background: #ffffff18;
  color: white;
  border-radius: 7px;
  padding: 8px 11px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

/* LAYOUT */

.container {
  position: relative;
  display: grid;
  grid-template-columns: 310px minmax(0, 1fr);
  gap: 10px;
  flex: 1;
  min-height: 0;
  padding: 10px;
  overflow: hidden;
}

/* PANEL NHẬP LIỆU */

.panel {
  min-width: 0;
  background: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 8px #0002;
  overflow-y: auto;
  overscroll-behavior: contain;
  z-index: 500;
}

h3 {
  margin: 0 0 12px;
  font-size: 17px;
}

label {
  display: block;
  font-weight: bold;
  margin: 10px 0 5px;
  font-size: 12px;
}

input {
  display: block;
  width: 100%;
  min-width: 0;
  height: 38px;
  padding: 8px 10px;
  border: 1px solid #c9ced6;
  border-radius: 6px;
  font-size: 16px;
  background: white;
}

/* BUTTON */

button.action {
  width: 100%;
  min-height: 42px;
  margin-top: 12px;
  border: 0;
  border-radius: 6px;
  background: var(--accent);
  color: white;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  touch-action: manipulation;
}

button.secondary {
  background: #687384;
}

button:disabled {
  opacity: .65;
  cursor: wait;
}

/* MAP */

#map {
  width: 100%;
  height: 100%;
  min-height: 0;
  border-radius: 8px;
  background: #e5e7eb;
}

/* KẾT QUẢ */

#result {
  margin-top: 12px;
  padding: 10px;
  background: #eef5ff;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.distance {
  color: #c62828;
  font-size: 19px;
  font-weight: bold;
}

/* ĐIỆN THOẠI */

@media (max-width: 700px) {

  :root {
    --header-height: 48px;
  }

  header {
    padding: 0 10px;
    font-size: 15px;
  }

  #mobileToggle {
    display: inline-block;
  }

  .container {
    display: block;
    padding: 0;
  }

  #map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 0;
  }

  .panel {
    position: absolute;
    top: 10px;
    left: 10px;
    width: min(330px, calc(100% - 20px));
    max-height: min(58vh, 520px);
    padding: 12px;
    border-radius: 10px;
    box-shadow: 0 3px 16px #0004;
    transition: transform .2s ease, opacity .2s ease;
  }

  .panel.collapsed {
    transform: translateY(calc(-100% - 20px));
    opacity: 0;
    pointer-events: none;
  }

  h3 {
    font-size: 15px;
    margin-bottom: 8px;
  }

  label {
    margin-top: 8px;
  }

  input {
    height: 40px;
  }

  button.action {
    min-height: 44px;
    margin-top: 9px;
  }

  #result {
    margin-top: 9px;
  }

  .leaflet-top {
    top: 8px;
  }

  .leaflet-right {
    right: 6px;
  }

  .leaflet-control-zoom a {
    width: 38px !important;
    height: 38px !important;
    line-height: 38px !important;
  }
}

@media (max-width: 380px) {
  header {
    font-size: 13px;
  }

  .panel {
    max-height: 62vh;
  }
}
</style>
</head>

<body>

<!-- TIÊU ĐỀ -->

<header>
  <span>QUẢN LÝ TUYẾN TRẠM BTS</span>

  <button id="mobileToggle"
  type="button"
  onclick="togglePanel()">
    ẨN NHẬP LIỆU
  </button>
</header>

<!-- GIAO DIỆN CHÍNH -->

<main class="container">

  <!-- BẢNG NHẬP THÔNG TIN -->

  <section class="panel" id="panel">

    <h3>THÔNG TIN TUYẾN</h3>

    <label for="station">Mã trạm</label>
    <input id="station" value="YBI0001" autocomplete="off">

    <label for="lat1">Vĩ độ điểm đầu (Latitude)</label>
    <input id="lat1"
    type="number"
    step="any"
    value="21.71875"
    inputmode="decimal">

    <label for="lng1">Kinh độ điểm đầu (Longitude)</label>
    <input id="lng1"
    type="number"
    step="any"
    value="104.90981"
    inputmode="decimal">

    <label for="lat2">Vĩ độ điểm cuối (Latitude)</label>
    <input id="lat2"
    type="number"
    step="any"
    value="21.6944253755925"
    inputmode="decimal">

    <label for="lng2">Kinh độ điểm cuối (Longitude)</label>
    <input id="lng2"
    type="number"
    step="any"
    value="104.8989334"
    inputmode="decimal">

    <button class="action"
    id="drawButton"
    type="button"
    onclick="drawRoute()">
      HIỂN THỊ TUYẾN ĐƯỜNG
    </button>

    <button class="action secondary"
    type="button"
    onclick="resetForm()">
      LÀM MỚI
    </button>

    <div id="result" aria-live="polite">
      Nhập thông tin và nhấn HIỂN THỊ TUYẾN ĐƯỜNG.
    </div>

  </section>

  <!-- BẢN ĐỒ -->

  <div id="map" aria-label="Bản đồ tuyến đường"></div>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ===================================
// 1. KHỞI TẠO BẢN ĐỒ
// ===================================

const map = L.map('map', {
  zoomControl: true
}).setView([21.71875, 104.90981], 14);


// ===================================
// 2. BẢN ĐỒ VỆ TINH
// ===================================

const satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri'
  }
);


// ===================================
// 3. BẢN ĐỒ ĐƯỜNG PHỐ
// ===================================

const street = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }
);


// Mặc định sử dụng vệ tinh

satellite.addTo(map);


// Chuyển đổi bản đồ

L.control.layers({
  'Vệ tinh': satellite,
  'Đường phố': street
}).addTo(map);


// ===================================
// 4. KHAI BÁO BIẾN
// ===================================

let routeLayer = null;
let markers = [];


// ===================================
// 5. ẨN HIỆN BẢNG NHẬP LIỆU
// ===================================

function togglePanel() {

  const panel = document.getElementById('panel');

  const button = document.getElementById('mobileToggle');

  const collapsed = panel.classList.toggle('collapsed');

  button.textContent = collapsed
    ? 'NHẬP THÔNG TIN'
    : 'ẨN NHẬP LIỆU';

  setTimeout(() => {
    map.invalidateSize();
  }, 250);
}


// ===================================
// 6. TÌM VÀ VẼ TUYẾN ĐƯỜNG
// ===================================

async function drawRoute() {

  const station =
    document.getElementById('station').value.trim();

  const lat1 =
    Number(document.getElementById('lat1').value);

  const lng1 =
    Number(document.getElementById('lng1').value);

  const lat2 =
    Number(document.getElementById('lat2').value);

  const lng2 =
    Number(document.getElementById('lng2').value);

  const result =
    document.getElementById('result');

  const button =
    document.getElementById('drawButton');


  // KIỂM TRA DỮ LIỆU

  if (
    !station ||
    document.getElementById('lat1').value.trim() === '' ||
    document.getElementById('lng1').value.trim() === '' ||
    document.getElementById('lat2').value.trim() === '' ||
    document.getElementById('lng2').value.trim() === '' ||
    ![lat1,lng1,lat2,lng2].every(Number.isFinite) ||
    Math.abs(lat1)>90 ||
    Math.abs(lat2)>90 ||
    Math.abs(lng1)>180 ||
    Math.abs(lng2)>180
  ) {

    alert('Vui lòng kiểm tra mã trạm và tọa độ hợp lệ.');

    return;
  }


  button.disabled = true;

  button.textContent = 'ĐANG TÌM ĐƯỜNG...';

  result.textContent = 'Đang tìm tuyến đường...';


  // TẠO URL TÌM ĐƯỜNG OSRM

  const url =
  `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;


  try {

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error('Không kết nối được máy chủ tìm đường.');
    }

    const data = await response.json();

    if (
      data.code !== 'Ok' ||
      !data.routes ||
      !data.routes.length
    ) {
      throw new Error('Không tìm thấy tuyến đường giữa hai tọa độ.');
    }


    const route = data.routes[0];


    // XÓA TUYẾN CŨ

    if (routeLayer) {
      map.removeLayer(routeLayer);
    }

    markers.forEach(marker => {
      map.removeLayer(marker);
    });

    markers = [];


    // VẼ TUYẾN MỚI

    routeLayer = L.geoJSON(route.geometry, {

      style: {
        color: '#087cff',
        weight: 5,
        opacity: 0.95
      }

    }).addTo(map);


    // ĐÁNH DẤU ĐIỂM ĐẦU

    markers.push(

      L.marker([lat1,lng1])
      .addTo(map)
      .bindPopup('Điểm đầu: ' + escapeHTML(station))

    );


    // ĐÁNH DẤU ĐIỂM CUỐI

    markers.push(

      L.marker([lat2,lng2])
      .addTo(map)
      .bindPopup('Điểm cuối')

    );


    // TỰ ĐỘNG CĂN KHUNG BẢN ĐỒ

    map.fitBounds(routeLayer.getBounds(), {
      padding: [35,35]
    });


    // TÍNH CỰ LY

    const km = (route.distance / 1000).toFixed(2);


    // HIỂN THỊ THÔNG TIN

    result.innerHTML = `

      <b>MÃ TRẠM:</b> ${escapeHTML(station)}<br>

      <b>ĐIỂM ĐẦU:</b><br>
      ${lat1}, ${lng1}<br>

      <b>ĐIỂM CUỐI:</b><br>
      ${lat2}, ${lng2}<br>

      <b>CỰ LY:</b>

      <span class="distance">
        ${km} km
      </span>

    `;


    // TỰ ĐỘNG ẨN BẢNG TRÊN ĐIỆN THOẠI

    if (
      window.matchMedia('(max-width: 700px)').matches
    ) {

      document.getElementById('panel')
        .classList.add('collapsed');

      document.getElementById('mobileToggle')
        .textContent = 'NHẬP THÔNG TIN';

    }

    setTimeout(() => {
      map.invalidateSize();
    }, 250);


  } catch (error) {

    result.textContent = 'Lỗi: ' + error.message;

  } finally {

    button.disabled = false;

    button.textContent = 'HIỂN THỊ TUYẾN ĐƯỜNG';

  }

}


// ===================================
// 7. BẢO VỆ NỘI DUNG HIỂN THỊ
// ===================================

function escapeHTML(value) {

  return value.replace(/[&<>"']/g, char => ({

    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'

  })[char]);

}


// ===================================
// 8. LÀM MỚI DỮ LIỆU
// ===================================

function resetForm() {

  [
    'station',
    'lat1',
    'lng1',
    'lat2',
    'lng2'
  ].forEach(id => {

    document.getElementById(id).value = '';

  });


  if (routeLayer) {
    map.removeLayer(routeLayer);
  }

  markers.forEach(marker => {
    map.removeLayer(marker);
  });

  routeLayer = null;

  markers = [];


  document.getElementById('result').textContent =
    'Nhập thông tin và nhấn HIỂN THỊ TUYẾN ĐƯỜNG.';


  map.setView([21.71875,104.90981],14);

}


// ===================================
// 9. TỰ ĐỘNG ĐIỀU CHỈNH KÍCH THƯỚC
// ===================================

window.addEventListener('resize', () => {

  setTimeout(() => {
    map.invalidateSize();
  }, 100);

});


setTimeout(() => {
  map.invalidateSize();
}, 250);

</script>

</body>
</html>
